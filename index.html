<script>
const S=[
["1. Internet y entorno web",[
["Internet","Gran red internacional de computadoras llamada «red de redes». Objetivo: comunicarse de inmediato con cualquier parte del mundo para obtener información, programas o juegos."],
["Origen: ARPANET","Red creada por el Ministerio de Defensa de EE. UU. en los años 60 (Advanced Projects Agency Net) para que la defensa del país compartiera recursos en una misma red."],
["World Wide Web (www)","«Red global mundial»: sistema de documentos de hipertexto enlazados, accesibles por Internet con un navegador. Se compone de sitios y páginas web con texto, imágenes y video."],
["Dominio","Nombre único que identifica a un sitio web en Internet (ej.: ctpaserri.ed.cr). Es más fácil de recordar que una dirección numérica IP."],
["Hipertexto","Texto con enlaces (hiperenlaces) que llevan a otros documentos o páginas. Es la base de la web."],
["Protocolos","Reglas que usan las computadoras para comunicarse en una red; permiten la conexión, comunicación y transferencia de datos entre dos puntos. Comunes: IP, TCP, DHCP, HTTP, FTP, Telnet, SMTP, SOAP. TCP/IP divide la información en paquetes (packets) y los envía por la red. FTP = transferencia de archivos."],
["Protocolo HTTP","Hypertext Transfer Protocol: el «lenguaje» que usan los servidores web y los navegadores para las páginas web. HTTPS es la versión segura (candadito)."],
["Dirección URL","Dirección única de un recurso en la web. Estructura: protocolo://dominio/ruta (ej.: https://www.mep.go.cr/inicio)."],
["Navegadores","Programas para visualizar páginas web: Google Chrome, Microsoft Edge, Mozilla Firefox, Internet Explorer. Buscadores: Google, Bing, Yahoo, Ask (sirven para encontrar información)."]],
"Confusión típica: navegador (programa para abrir la web, ej. Chrome) ≠ buscador (sitio para buscar, ej. Google)."],
["2. Comunicación en Internet",[
["Correo electrónico","Más rápido y fiable que el correo tradicional (no se extravía); emisor y receptor no tienen que estar conectados al mismo tiempo."],
["Dirección de correo","usuario@dominio.organización.país. Partes: 1) usuario (nombre/ID), 2) arroba @ (separa usuario y dominio), 3) dominio (proveedor), 4) organización (.edu, .com, .org…), 5) extensión de país (.cr, .ar…). Ej.: andres@ejemplo.com.ar"],
["Chat","Comunicación escrita instantánea entre dos o más personas. Puede ser público (cualquiera accede) o privado (solo 2 personas)."],
["Telnet","Conexión remota a otro ordenador solo para mirar datos (consultar una base de datos, ej. libros de una biblioteca). No se pueden traer archivos (eso se hace con FTP)."],
["Redes sociales","Facebook, X/Twitter, LinkedIn, TikTok, Instagram. Ventajas: comunicación rápida, comunidades, activismo, entorno educativo cooperativo, relación empresa-cliente. Desventajas: falta de privacidad, adicción y daños psicológicos si se usan en exceso."],
["Videoconferencia","Comunicación oral y visual a distancia. Ventajas: multiplataforma (celular o PC), sin fronteras con Internet, contacto visual, facilita el teletrabajo."]],
"Orden de la dirección de correo: usuario → @ → dominio → organización → país."],
["3. Tecnologías emergentes",[
["Industria 4.0","Nació en Alemania; «fábricas inteligentes» conectadas y basadas en datos (4.ª revolución industrial). Principios: conexión en red de personas, máquinas y cosas (Internet de las cosas), uso de datos para eficiencia, pruebas virtuales para mejorar calidad y rapidez, producción y mantenimiento basados en datos."],
["Impresión 3D","Fabricación por adición: objeto creado por capas sucesivas de material. Ventajas: prototipos rápidos, diseños sin límites, reducción de costos. Desventajas: pérdida de puestos de trabajo, tiempo de producción, dependencia y contaminación por plástico."],
["Realidad Aumentada (RA)","Combina el mundo real con elementos virtuales en tiempo real usando un dispositivo (celular, webcam, tablet). Ej.: Pokémon Go, Google Lens. Necesita: objeto real de referencia, dispositivo con cámara y software que interprete la imagen. En empresas: probar productos antes de comprar, menos costos de muestras y devoluciones, marketing interactivo."],
["Realidad Virtual (RV)","Crea un ambiente 100 % digital que reemplaza lo real (inmersión completa). Diferencia clave: RV reemplaza la realidad; RA agrega elementos digitales a la realidad."],
["Inteligencia Artificial (IA)","Algoritmos que buscan crear máquinas con capacidades similares a las humanas. Funciona con grandes cantidades de datos + procesamiento rápido + algoritmos que aprenden patrones. Usos: ventas y marketing (analiza tu navegación), medicina (diagnósticos)."],
["Simuladores","Programas o aparatos que replican o recrean una actividad para dar experiencias y sensaciones. Tipos: conducción, carrera, vuelo, música, vida; también simulan el día a día de una empresa."]],
"Para cada tecnología prepara: concepto, un ejemplo, una ventaja y una desventaja, y cómo se asocia a tu especialidad."],
["4. Ciberseguridad y datos personales",[
["Ciberseguridad","Protección de equipos, redes y datos contra accesos, robos o daños. Es necesaria porque guardamos información personal y financiera en línea. Violar la seguridad puede causar fraude, robo de identidad, pérdidas económicas, daño a la reputación y pérdida de datos de una organización."],
["Datos personales","Información que identifica a una persona (nombre, cédula, dirección, teléfono, fotos, ubicación, cuentas, datos bancarios). Para una organización, los datos de clientes y empleados son un activo valioso que debe protegerse."],
["Tipos de ataques (repaso general)","Phishing: correo o mensaje falso que imita a una entidad para robar datos. Malware: software dañino (virus, troyanos, spyware). Ransomware: secuestra archivos y pide rescate. Ingeniería social: engañar a la persona para que dé información. Suplantación de identidad. Fuerza bruta: probar contraseñas hasta acertar."],
["Vulnerabilidades en línea","Contraseñas débiles, redes wifi públicas, no actualizar sistemas, instalar apps sospechosas, configurar mal la privacidad, aceptar solicitudes de desconocidos."],
["Huella digital","Rastro de toda nuestra actividad en Internet. Se construye con 3 elementos: IP (identifica el dispositivo y revela ubicación, navegador, sistema operativo, idioma), cookies (datos que vinculan nuestras acciones) y redes sociales (lo que publicamos y comentamos). Aunque borremos publicaciones, los proveedores pueden conservarlas."],
["Identidad digital","La «fotografía» de quiénes somos en la red: se forma por lo que publicamos nosotros y por lo que otros publican de nosotros. Los reclutadores la consultan al contratar."],
["¿Para qué se usa la huella?","Publicidad dirigida: «si no estamos pagando por el producto, nuestra información es la paga». Ejemplo de abuso: Cambridge Analytica usó huellas digitales de millones de personas para influir en el voto."],
["Cómo protegernos","Contraseñas largas (letras, números y símbolos), secretas, distintas por cuenta, sin nombres ni fechas importantes, cambiadas periódicamente. Navegar en páginas https:// con candadito; evitar wifi público; modo incógnito; cerrar sesiones. Correos distintos para trabajo, suscripciones y trámites. Revisar y borrar cookies. Eliminar apps que no usamos y no dar permisos innecesarios. Actualizar el sistema, usar clave en el dispositivo y apagar wifi, bluetooth y GPS si no se usan."],
["Algoritmos","Operación matemática que, con los datos recopilados, da respuesta a un problema. Las redes los usan para mantenernos conectados más tiempo y mostrarnos publicidad e contenido según nuestra huella («más de lo mismo»)."],
["Cámara de eco y filtro burbuja","Metáfora: solo escuchamos nuestra propia opinión repetida. Limita el debate y la diversidad de ideas. Cómo reducirla: informarse en medios oficiales, no eliminar a quienes piensan distinto, leer medios con los que no estamos de acuerdo."],
["Trolls y bots","Trolls: perfiles falsos o anónimos que insultan o generan conflicto. Qué hacer: bloquear, denunciar y no engancharse."],
["Desinformación","Contenido falso, manipulado o fuera de contexto, creado a propósito para dañar, estafar o por diversión. Misinformación: se comparte sin saber que es falso. Malinformación: contenido real usado en un contexto engañoso para dañar."],
["8 categorías de desinformación","1) Contenido falso (fake news). 2) Sátira o parodia. 3) Conexión falsa (titular no corresponde; «ciberanzuelo»). 4) Contenido engañoso (datos usados a conveniencia). 5) Contexto falso. 6) Contenido impostor (usa logos o personas conocidas). 7) Contenido manipulado (imágenes o audios alterados, deepfakes con IA). 8) Contenido fabricado."],
["Cómo verificar","Respirar si el contenido genera emoción fuerte; desconfiar de lo que nos gusta porque confirma lo que creemos; verificar en otras fuentes. Preguntas: ¿leí toda la noticia?, ¿cuál es la fuente?, ¿es actual?, ¿está en otros medios?, ¿tiene formato profesional?, ¿menciona expertos?, ¿es hecho u opinión?, ¿es broma o engaño?"]],
"La desinformación debilita la democracia porque reduce la confianza en la información y las instituciones."],
["5. Ciudadanía digital, ética y deberes",[
["Ciudadanía digital","Conocimientos, actitudes y habilidades para actuar con responsabilidad, respeto y ética en el mundo digital, aplicando valores democráticos."],
["Netiqueta","«Etiqueta en la red»: normas de buen comportamiento en línea (término de Virginia Shea, 1994). Ej.: tratar con respeto, no escribir en mayúsculas sostenidas (se interpreta como gritar), no compartir datos ajenos, pensar antes de publicar."],
["Principios democráticos","Libertad (tiene límites: reglas de las redes, leyes y nuestra ética), igualdad (somos diferentes; pensar quién leerá nuestro mensaje) y fraternidad (compartir lo que aporta, silenciar el caos sin comentar ni compartir)."],
["Valores","Respeto (hablar como cara a cara; no publicar fotos o comentarios de otros sin permiso), responsabilidad (pensar en consecuencias, seguir las reglas de cada sitio, no publicar si no se está seguro de la veracidad) y diálogo plural (hablar y escuchar a quien piensa distinto; es el antídoto de la cámara de eco)."],
["Para evitar malentendidos","Expresar cómo nos sentimos («me alegra», «me molesta»), indicar (sarcasmo) si se usa y apoyarse en emoticones."],
["Deberes del ciudadano digital","Respetar a las demás personas y la diversidad, proteger sus datos y los ajenos, verificar antes de compartir, respetar derechos de autor y reglas de las plataformas, usar contraseñas seguras, denunciar abusos."],
["Derechos del ciudadano digital","Acceso a Internet y a la información, libertad de expresión (con límites), privacidad y protección de datos personales, seguridad, a no ser discriminado y a ser respetado en línea."],
["Principios éticos y legales","Éticos: honestidad, respeto, responsabilidad, privacidad. Legales: derechos de autor (citar fuentes, no copiar ni piratear), leyes contra delitos informáticos, suplantación y acoso, y términos de uso de cada plataforma."],
["Uso responsable de redes","Configurar la privacidad, no publicar ubicación ni datos sensibles (el GPS puede mostrar cuándo no estamos en casa), aceptar solo a quien conocemos, bloquear y denunciar abusos, limitar el tiempo de uso."]],
"Las redes sociales no son el enemigo: bien usadas sirven para comunicar, educar y construir comunidad."],
["6. Teclado y digitación",[
["Fila base","Los dedos descansan sobre A S D F (mano izquierda) y J K L Ñ (mano derecha). Los pulgares van en la barra espaciadora."],
["Dedos guía","Los índices tienen una marca en F y J para ubicar la posición sin mirar."],
["Qué dedo usa cada tecla","Meñique: A, Q, Z (izq.) y Ñ, P (der.). Anular: S, W, X y L, O. Medio: D, E, C y K, I. Índice: F, R, V, G, T, B (izq.) y J, U, M, H, Y, N (der.)."],
["Repaso","La información teórica está en el folleto de Destrezas Digitales, en cada meta: al inicio indica el dedo a usar. Practica sin mirar el teclado."]],
"Repasa el folleto: el examen pide el dedo correcto para cada tecla."]

const $=s=>document.querySelector(s),esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#nav button,main section").forEach(e=>e.classList.remove("on"));b.classList.add("on");$("#"+b.dataset.t).classList.add("on");scrollTo(0,0)});
$("#res").innerHTML=S.map((s,i)=>`<details ${i?"":"open"}><summary>${s[0]}</summary><div class="body"><dl>${s[1].map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join("")}</dl><div class="tip">💡 ${esc(s[2])}</div></div></details>`).join("");
// Quiz
let qi=0,sc=0,wrong=[],order=[];
function startQ(arr){order=arr;qi=0;sc=0;wrong=[];showQ()}
function showQ(){
 const q=$("#quiz");
 if(qi>=order.length){const p=Math.round(sc/order.length*100);q.innerHTML=`<div class="card"><p class="q">Resultado: ${sc} de ${order.length} (${p} %)</p><p>${p>=90?"¡Excelente! Estás listo/a para el examen.":p>=70?"Muy bien, repasa los puntos que fallaste.":"Repasa el resumen y vuelve a intentarlo."}</p>${wrong.length?`<button class="btn" id="rw">Practicar solo las falladas (${wrong.length})</button>`:""}<button class="btn s" id="ra">Reiniciar todo</button></div>`;
  if(wrong.length)$("#rw").onclick=()=>startQ([...wrong]);$("#ra").onclick=()=>startQ(shuffle([...Q.keys()]));return}
 const d=Q[order[qi]],pc=qi/order.length*100;
 q.innerHTML=`<div class="meta"><span>Pregunta ${qi+1} de ${order.length}</span><span>✔ ${sc}</span></div><div class="bar"><i style="width:${pc}%"></i></div><div class="card"><p class="q">${esc(d[0])}</p>${d[1].map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}<div id="ex"></div></div>`;
 q.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;q.querySelectorAll(".opt").forEach(x=>x.disabled=true);
  q.querySelectorAll(".opt")[d[2]].classList.add("ok");
  if(j===d[2])sc++;else{b.classList.add("ko");wrong.push(order[qi])}
  $("#ex").innerHTML=`<p class="exp">${j===d[2]?"✅ ¡Correcto! ":"❌ "}${esc(d[3])}</p><button class="btn" id="nx">${qi+1<order.length?"Siguiente":"Ver resultado"}</button>`;
  $("#nx").onclick=()=>{qi++;showQ()}})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
startQ(shuffle([...Q.keys()]));
// Flashcards
const F=S.flatMap(s=>s[1]);let fi=0,fo=[...F.keys()],back=false;
function showF(){const c=F[fo[fi]];$("#fc").innerHTML=`<div class="meta"><span>Tarjeta ${fi+1} de ${F.length}</span><span>Toca la tarjeta para voltearla</span></div><div class="card fc" id="c"><div><small>${back?"Definición":"Concepto"}</small>${back?esc(c[1]):"<b>"+esc(c[0])+"</b>"}</div></div><button class="btn s" id="pv">← Anterior</button><button class="btn" id="nf">Siguiente →</button><button class="btn s" id="sh">🔀 Mezclar</button>`;
 $("#c").onclick=()=>{back=!back;showF()};$("#pv").onclick=()=>{fi=(fi-1+F.length)%F.length;back=false;showF()};$("#nf").onclick=()=>{fi=(fi+1)%F.length;back=false;showF()};$("#sh").onclick=()=>{fo=shuffle(fo);fi=0;back=false;showF()}}
showF();

</script>
